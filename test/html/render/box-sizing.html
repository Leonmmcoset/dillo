<!doctype html><html><head><title>CSS box sizing</title><style>body{margin:0} section{position:relative;width:400px;height:50px} .box{padding:10px;border:5px solid black;background:green;margin:0 7px} </style></head><body><section><div class="box" style="box-sizing:border-box;width:200px;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:50%;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:200px;min-width:240px;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:280px;max-width:200px;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:200px;height:20px;min-height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:200px;height:80px;max-height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;width:5px;height:5px"></div></section>
<section><div class="box" style="box-sizing:border-box;float:left;width:200px;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;position:absolute;left:0;top:0;width:200px;height:40px"></div></section>
<section><div class="box" style="box-sizing:border-box;position:absolute;left:0;top:0;width:50%;height:50%"></div></section></body></html>
